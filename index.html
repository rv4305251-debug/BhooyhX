<!DOCTYPE html>
<html lang="en" class="w-full max-w-full overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BhooyahX - Free Fire Esports Tournaments</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            gaming: ['Teko', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#FF1E40',
              orange: '#FF7700',
              dark: '#0A0B0E',
              darkcard: '#14161D',
              lightcard: '#FFFFFF',
              lightbg: '#F3F4F6'
            }
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      position: relative;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    *, *:before, *:after { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #9CA3AF; border-radius: 9999px; }
    .mobile-header-bar { padding-top: calc(0.75rem + env(safe-area-inset-top, 28px)) !important; }
    .mobile-gate-pad { padding-top: calc(1.5rem + env(safe-area-inset-top, 28px)) !important; }
    .mobile-bottom-nav { padding-bottom: calc(0.6rem + env(safe-area-inset-bottom, 12px)) !important; }
    .mobile-main-pad { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 12px)) !important; }
  </style>
</head>
<body class="bg-[#F3F4F6] text-gray-900 font-body antialiased transition-colors duration-300 min-h-screen flex flex-col justify-between selection:bg-brand-red selection:text-white w-full max-w-full overflow-x-hidden" id="appBody">

  <!-- AUTH GATE SCREEN -->
  <div id="authGateContainer" class="mobile-gate-pad min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-[#E5E7EB] via-[#F3F4F6] to-white w-full max-w-full overflow-x-hidden">
    <div class="bg-white border border-gray-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl relative text-gray-900" id="authGateCard">
      <div class="flex flex-col items-center text-center space-y-2">
        <div class="w-16 h-16">
          <svg viewBox="0 0 100 100" class="w-full h-full filter drop-shadow">
            <defs>
              <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FF1E40" />
                <stop offset="50%" stop-color="#FF7700" />
                <stop offset="100%" stop-color="#FFD600" />
              </linearGradient>
            </defs>
            <polygon points="50,5 92,20 80,72 50,96 20,72 8,20" fill="#14161D" stroke="url(#gateGrad)" stroke-width="3.5" />
            <polygon points="50,14 82,26 72,66 50,86 28,66 18,26" fill="#0A0B0E" opacity="0.8" />
            <path d="M33 32 L67 68 M67 32 L33 68" stroke="url(#gateGrad)" stroke-width="7" stroke-linecap="round" />
            <circle cx="50" cy="50" r="8" fill="#FF1E40" />
            <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
          </svg>
        </div>
        <h1 class="font-gaming text-3xl uppercase font-bold tracking-wider bg-gradient-to-r from-red-600 via-orange-500 to-yellow-500 bg-clip-text text-transparent" id="gateBrandTitle">BhooyahX</h1>
        <p class="text-xs text-gray-500">Competitive Free Fire Tournaments</p>
      </div>

      <div class="flex border-b border-gray-200">
        <button onclick="switchAuthGateMode('login')" id="gateTabLogin" class="flex-1 pb-2 text-center font-display font-bold text-sm text-brand-red border-b-2 border-brand-red transition-all">Sign In</button>
        <button onclick="switchAuthGateMode('register')" id="gateTabRegister" class="flex-1 pb-2 text-center font-display font-bold text-sm text-gray-400 transition-all">Register</button>
      </div>

      <div id="gateAlert" class="hidden p-2.5 rounded-xl bg-red-100 border border-red-300 text-[11px] text-red-700"></div>

      <!-- LOGIN -->
      <div id="gateLoginForm" class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-700 font-semibold mb-1">Email ya Mobile No.:</label>
          <input type="text" id="gateLoginEmail" placeholder="Enter your email or mobile no." class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 text-gray-900 outline-none focus:border-brand-red transition">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-1">Password:</label>
          <input type="password" id="gateLoginPassword" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 text-gray-900 outline-none focus:border-brand-red transition">
        </div>
        <button onclick="handleAuthLogin()" id="btnGateLogin" class="w-full py-3 bg-gradient-to-r from-brand-red to-brand-orange text-white font-bold rounded-xl uppercase tracking-wider text-xs shadow-md hover:brightness-110 active:scale-95 transition">Enter Arena</button>
      </div>

      <!-- REGISTER WITH REFERRAL CODE -->
      <div id="gateRegisterForm" class="hidden space-y-2.5 text-xs">
        <div>
          <label class="block text-gray-700 font-semibold mb-0.5">Gmail ya Mobile No.:</label>
          <input type="text" id="gateRegEmail" placeholder="player@gmail.com ya 9876543210" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-gray-900 outline-none focus:border-brand-red">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-0.5">Username:</label>
          <input type="text" id="gateRegUsername" placeholder="e.g. shadow_hunter" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-gray-900 outline-none focus:border-brand-red">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-0.5">Free Fire IGN:</label>
          <input type="text" id="gateRegIGN" placeholder="e.g. RAISTAR_OP" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-gray-900 outline-none focus:border-brand-red">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-0.5">Free Fire UID (8-10 digits):</label>
          <input type="text" id="gateRegUID" placeholder="e.g. 1029384756" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-gray-900 font-mono outline-none focus:border-brand-red">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-0.5 flex justify-between items-center">
            <span>Referral Code (Optional):</span>
            <span class="text-[10px] text-emerald-600 font-bold" id="regReferralBonusLabel">Bonus Reward</span>
          </label>
          <input type="text" id="gateRegReferralCode" placeholder="Enter friend's FF UID" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-gray-900 outline-none focus:border-brand-red">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-0.5">Password (Min 6 chars):</label>
          <input type="password" id="gateRegPassword" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-gray-900 outline-none focus:border-brand-red">
        </div>
        <button onclick="handleAuthRegister()" id="btnGateRegister" class="w-full py-3 bg-gradient-to-r from-brand-red to-brand-orange text-white font-bold rounded-xl uppercase tracking-wider text-xs shadow-md hover:brightness-110 active:scale-95 transition mt-2">Create Account</button>
      </div>
    </div>
  </div>

  <!-- AUTHENTICATED APP SHELL -->
  <div id="authenticatedApp" class="hidden flex flex-col min-h-screen justify-between w-full max-w-full overflow-x-hidden">
    <!-- TOP HEADER -->
    <header class="mobile-header-bar sticky top-0 z-40 backdrop-blur-md bg-white/90 border-b border-gray-200 transition-colors duration-300 px-3 pb-2.5 pt-7 w-full" id="headerNav">
      <div class="max-w-md w-full mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('lobby')">
          <div class="w-9 h-9 flex-shrink-0">
            <svg viewBox="0 0 100 100" class="w-full h-full filter drop-shadow">
              <polygon points="50,5 92,20 80,72 50,96 20,72 8,20" fill="#14161D" stroke="#FF1E40" stroke-width="3.5" />
              <path d="M33 32 L67 68 M67 32 L33 68" stroke="#FF7700" stroke-width="7" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <span id="brandNameDisplay" class="font-gaming tracking-wider text-xl uppercase font-bold bg-gradient-to-r from-red-600 via-orange-500 to-yellow-500 bg-clip-text text-transparent">BhooyahX</span>
            <p class="text-[9px] text-gray-500 -mt-0.5 font-display">Daily Free Fire Battles</p>
          </div>
        </div>

        <!-- Right Header Actions (Refresh + Wallet Pill + Profile Avatar) -->
        <div class="flex items-center gap-2">
          <!-- INSTANT SYNC REFRESH BUTTON -->
          <button onclick="manualSyncRefresh()" id="headerRefreshBtn" class="w-8 h-8 rounded-full bg-gray-100 border border-gray-300 flex items-center justify-center text-gray-700 hover:text-brand-red hover:border-brand-red active:scale-90 transition shadow-sm" title="Refresh Live Data">
            <i class="ph-bold ph-arrows-clockwise text-base" id="headerRefreshIcon"></i>
          </button>

          <button onclick="switchTab('wallet')" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-600 hover:bg-amber-500/20 transition-all text-xs font-semibold">
            <i class="ph-bold ph-coins text-amber-500 text-sm"></i>
            <span id="headerWalletBal">₹0.00</span>
          </button>

          <button onclick="switchTab('profile')" class="w-8 h-8 rounded-full bg-gray-100 border border-gray-300 flex items-center justify-center text-xs font-bold font-gaming text-brand-orange hover:border-brand-red transition">
            <span id="headerProfileLetter">U</span>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-md w-full mx-auto px-3 py-4 mobile-main-pad transition-all overflow-x-hidden">
      <!-- VIEW 1: TOURNAMENT LOBBY -->
      <section id="viewLobby" class="space-y-4 w-full">
        <div id="tournamentCardsContainer" class="space-y-3 w-full"></div>
      </section>

      <!-- VIEW 2: MY MATCHES -->
      <section id="viewMyMatches" class="hidden space-y-4 w-full">
        <h2 class="text-lg font-bold font-display uppercase tracking-wide flex items-center gap-1.5 text-gray-900">
          <i class="ph-bold ph-sword text-brand-red"></i> My Registered Matches
        </h2>
        <div id="myMatchesList" class="space-y-3 w-full"></div>
      </section>

      <!-- VIEW 3: WALLET -->
      <section id="viewWallet" class="hidden space-y-4 w-full">
        <div class="rounded-2xl p-5 bg-white border border-gray-200 shadow-md">
          <span class="text-xs font-medium uppercase tracking-wider text-gray-500">Available Balance</span>
          <div class="text-3xl font-display font-bold text-gray-900">₹<span id="walletTotalBal">0.00</span></div>
          <div class="grid grid-cols-2 gap-3 mt-4">
            <button onclick="openAddMoneyModal()" class="py-2.5 bg-gradient-to-r from-brand-red to-brand-orange text-white font-bold rounded-xl text-xs uppercase shadow">Add Money</button>
            <button onclick="openWithdrawModal()" class="py-2.5 bg-gray-100 text-gray-800 font-bold rounded-xl text-xs uppercase border border-gray-300">Withdraw</button>
          </div>
        </div>
        <div id="walletTransactionsList" class="space-y-2 mt-4"></div>
      </section>

      <!-- VIEW 4: PROFILE -->
      <section id="viewProfile" class="hidden space-y-4 w-full">
        <!-- USER PROFILE HEADER -->
        <div class="rounded-2xl p-4 bg-white border border-gray-200 shadow-sm flex items-center gap-3.5">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-red to-brand-orange flex items-center justify-center text-white text-2xl font-bold font-gaming">
            <span id="profileAvatarLetter">U</span>
          </div>
          <div class="flex-1">
            <h3 id="profileUsername" class="font-bold text-base text-gray-900">Player</h3>
            <p class="text-xs text-gray-500">FF UID: <span id="profileUID" class="text-amber-600 font-mono font-bold">-</span></p>
